<svg xmlns="http://www.w3.org/2000/svg" viewBox="-330 20 660 490" role="img" aria-label="A violet gem dropping through a golden ring and becoming a VE coin"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161827"/>
      <stop offset="0.6" stop-color="#1a1e3a"/>
      <stop offset="1" stop-color="#241d3f"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2c14e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f2c14e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6cf0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b6cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gemA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9b8ff"/><stop offset="1" stop-color="#6d4fd6"/>
    </linearGradient>
    <linearGradient id="gemB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6cf0"/><stop offset="1" stop-color="#3b2a8f"/>
    </linearGradient>
    <linearGradient id="gemC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a48cf5"/><stop offset="1" stop-color="#4a37ad"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe08a"/><stop offset="0.5" stop-color="#f2c14e"/><stop offset="1" stop-color="#b8862b"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a25"/><stop offset="0.5" stop-color="#f7d675"/><stop offset="1" stop-color="#8a6a25"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f2c14e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2c14e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dcf0"/>
    </linearGradient>
    
  </defs><circle cx="0" cy="270" r="250" fill="url(#glowGold)"/>
      <!-- vertical beam -->
      <rect x="-70" y="60" width="140" height="200" fill="url(#beam)"/>

      <!-- back ring -->
      <ellipse cx="0" cy="250" rx="190" ry="52" fill="none" stroke="url(#goldRing)" stroke-width="14"/>
      <ellipse cx="0" cy="250" rx="170" ry="42" fill="#0e1020" fill-opacity="0.8"/>
      <ellipse cx="0" cy="250" rx="120" ry="28" fill="#f2c14e" fill-opacity="0.35"/>

      <!-- falling gem -->
      <g transform="translate(0,135)">
        <polygon points="-58,-40 58,-40 84,-4 0,96 -84,-4" fill="url(#gemB)"/>
        <polygon points="-58,-40 -22,-40 -30,-4 -84,-4" fill="url(#gemA)"/>
        <polygon points="-22,-40 22,-40 30,-4 -30,-4" fill="#e3d9ff" fill-opacity="0.85"/>
        <polygon points="22,-40 58,-40 84,-4 30,-4" fill="url(#gemC)"/>
        <polygon points="-84,-4 -30,-4 0,96" fill="#5b3fc4"/>
        <polygon points="-30,-4 30,-4 0,96" fill="#7a5cf0"/>
        <polygon points="30,-4 84,-4 0,96" fill="#4330a3"/>
        <path d="M-58,-40 L58,-40 L84,-4 L0,96 L-84,-4 Z" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
        <animateTransform attributeName="transform" type="translate" values="0,135;0,123;0,135" dur="5s" repeatCount="indefinite"/>
      </g>

      <!-- rising VE coin -->
      <g transform="translate(0,398) scale(0.78)">
        <ellipse cx="0" cy="118" rx="112" ry="16" fill="#000" fill-opacity="0.35"/>
        <circle r="104" fill="url(#goldRing)"/>
        <circle r="92" fill="url(#gold)"/>
        <circle r="76" fill="none" stroke="#8a6a25" stroke-opacity="0.55" stroke-width="3"/>
        <text x="0" y="24" text-anchor="middle" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="70" font-weight="900" fill="#6b4c12" letter-spacing="-2">VE</text>
        <path d="M-70,-40 A90,90 0 0 1 20,-88" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,8;0,0" dur="6s" repeatCount="indefinite"/>
      </g>

      <!-- front ring rim -->
      <path d="M-190,250 A190,52 0 0 0 190,250" fill="none" stroke="url(#goldRing)" stroke-width="14" stroke-linecap="round"/>

      <!-- floating small gems -->
      <g>
        <g transform="translate(-230,120) rotate(-18)">
          <polygon points="-16,-12 16,-12 24,-1 0,28 -24,-1" fill="url(#gemA)"/>
          <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0;0,-10;0,0" dur="4s" repeatCount="indefinite"/>
        </g>
        <g transform="translate(240,90) rotate(14) scale(0.8)">
          <polygon points="-16,-12 16,-12 24,-1 0,28 -24,-1" fill="url(#gemC)"/>
        </g>
        <g transform="translate(-140,50) rotate(8) scale(0.55)">
          <polygon points="-16,-12 16,-12 24,-1 0,28 -24,-1" fill="url(#gemB)"/>
        </g>
        <g transform="translate(290,230) scale(0.6)">
          <circle r="16" fill="url(#gold)"/>
        </g>
      </g>

      <!-- sparkles -->
      <g fill="#fbe08a">
        <path d="M-120,250 l3,-9 3,9 9,3 -9,3 -3,9 -3,-9 -9,-3z"/>
        <path d="M150,200 l2.5,-7 2.5,7 7,2.5 -7,2.5 -2.5,7 -2.5,-7 -7,-2.5z"/>
        <path d="M60,60 l2,-6 2,6 6,2 -6,2 -2,6 -2,-6 -6,-2z" fill="#c9b8ff"/>
        <path d="M-200,300 l2,-6 2,6 6,2 -6,2 -2,6 -2,-6 -6,-2z"/>
      </g>
    </svg>